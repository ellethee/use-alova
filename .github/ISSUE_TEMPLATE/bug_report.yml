name: Bug report
description: Report something that does not work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "2.1.1"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node, pnpm, Vue, alova and browser versions.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal reproduction (repository or snippet) helps a lot.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any token or secret before pasting.
