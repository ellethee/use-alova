name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: input
    id: package
    attributes:
      label: Package
      placeholder: "@ilpachi/use-alova/notify"
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do and what is missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
