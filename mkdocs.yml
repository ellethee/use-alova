site_name: "@ilpachi/use-alova"
site_description: "Vue 3 wrapper for alova with auth, response pipelines and centralized error handling"
repo_url: https://github.com/ellethee/use-alova
site_url: https://ellethee.github.io/use-alova/
repo_name: ellethee/use-alova
docs_dir: docs
exclude_docs: |
  api/
theme:
  name: material
  font: false
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Guide:
      - Getting started: guide/getting-started.md
      - Subpaths: guide/subpaths.md
      - Pipelines and handlers: guide/pipelines.md
      - Cache and retry: guide/cache-and-retry.md
      - Backend contract: guide/backend-contract.md
      - Migration from 1.x: guide/migration.md
